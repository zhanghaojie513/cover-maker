<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- cover-maker · base template · 1080x1440 (3:4) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Zhi+Mang+Xing&display=swap');

:root{
  --bg:        #0a0a0f;
  --bg-2:      #101018;
  --ink:       #f5f2ea;
  --ink-dim:   #b8b2a4;
  --gold-hi:   #f7e7b0;
  --gold:      #e8c25a;
  --gold-mid:  #d4a017;
  --gold-lo:   #8a6414;
  --line-gold: rgba(232,194,90,.28);
  --glow:      rgba(232,194,90,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1080px;height:1440px;overflow:hidden;position:relative;
  background:var(--bg);color:var(--ink);
  font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;
}

/* ---- 质感原语 ---- */
.gold-text{
  background:linear-gradient(168deg,var(--gold-hi) 8%,var(--gold-mid) 46%,var(--gold-lo) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.num-3d{
  filter:drop-shadow(0 3px 0 rgba(90,62,8,.9)) drop-shadow(0 7px 0 rgba(0,0,0,.45))
         drop-shadow(0 18px 30px rgba(0,0,0,.6));
}
.glow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--glow) 0%,transparent 62%)}
.star{position:absolute;pointer-events:none;
  filter:drop-shadow(0 0 8px var(--gold))}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:90;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
.hand{font-family:'Zhi Mang Xing','Noto Sans SC',cursive;color:var(--gold)}
.brush{display:inline-block;background:var(--gold);height:12px;
  transform:skewX(-12deg);border-radius:2px;position:relative;top:-10px}

/* ---- 结构件 ---- */
.capsule{display:inline-flex;align-items:center;gap:12px;border-radius:999px;
  height:48px;padding:0 28px;font-size:24px;font-weight:700}
.capsule.gold{background:linear-gradient(135deg,var(--gold-hi),var(--gold-mid));color:#141410}
.capsule.line{border:1.5px solid var(--line-gold);color:var(--gold)}
.capsule .dot{width:10px;height:10px;background:#141410;transform:rotate(45deg)}
.capsule.line .dot{background:var(--gold)}

.card{position:absolute;border-radius:20px;
  background:linear-gradient(160deg,#15151f,#0f0f16);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 24px 48px rgba(0,0,0,.55)}
.card.hero{border-color:var(--line-gold);
  box-shadow:0 10px 20px rgba(0,0,0,.5),0 34px 64px rgba(0,0,0,.65)}
.card.ghost{filter:blur(6px);opacity:.25}
.card .icon{width:56px;height:56px;stroke:var(--gold);fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .t{font-size:24px;font-weight:700;color:var(--ink)}
.card .d{font-size:19px;color:var(--ink-dim)}

/* ---- 示例结构（构建时替换） ---- */
.stage{position:absolute;inset:0;padding:72px 64px}
.title{font-weight:900;font-size:104px;line-height:1.12;letter-spacing:-.01em}
.en-note{font-size:22px;font-weight:700;letter-spacing:.22em;color:var(--gold)}
</style>
</head>
<body>

<!-- 光晕示例 -->
<div class="glow" style="width:760px;height:760px;left:-160px;top:60px"></div>

<!-- 星芒示例（四角星 SVG） -->
<svg class="star" width="26" height="26" viewBox="-13 -13 26 26" style="left:620px;top:210px">
  <path d="M0,-13 L2.9,-2.9 13,0 2.9,2.9 0,13 -2.9,2.9 -13,0 -2.9,-2.9 Z" fill="#f7e7b0"/>
</svg>

<div class="stage">
  <!-- 顶部标签 -->
  <div style="display:flex;gap:16px">
    <span class="capsule gold"><span class="dot"></span>设计师·交互指南</span>
    <span class="capsule line"><span class="dot"></span>交互组件</span>
  </div>

  <!-- 数字 + 英文小注 -->
  <div style="margin-top:56px;display:flex;align-items:flex-start;gap:28px">
    <div class="gold-text num-3d" style="font-weight:900;font-size:300px;line-height:.9">10</div>
    <div class="en-note" style="margin-top:28px">UI INTERACTION<br>COMPONENTS</div>
  </div>

  <!-- 金白交错标题 -->
  <div class="title" style="margin-top:24px">
    <div>提升审美质感的</div>
    <div class="gold-text">高级交互组件</div>
  </div>

  <!-- 手写批注 + 笔刷 -->
  <div style="margin-top:36px;font-size:34px">
    <span class="hand">每种都配 AI 描述词</span><span class="brush" style="width:220px"></span>
  </div>
</div>

<!-- 卡片堆叠示例（绝对定位，构建时重排） -->
<div class="card ghost" style="width:270px;height:330px;right:60px;top:700px;transform:rotate(7deg)"></div>
<div class="card" style="width:280px;height:340px;right:120px;top:840px;transform:rotate(-6deg);padding:30px">
  <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
  <div class="t" style="margin-top:18px">卡片标题</div>
  <div class="d" style="margin-top:8px">一行说明文字示例</div>
</div>
<div class="card hero" style="width:300px;height:360px;right:330px;top:960px;transform:rotate(5deg);padding:32px">
  <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  <div class="t" style="margin-top:20px">主视觉卡片</div>
  <div class="d" style="margin-top:8px">hero 卡配金描边与重投影</div>
</div>

<!-- 粒子（JS 固定 seed 生成，避开中心文字区） -->
<canvas id="px" width="1080" height="1440" style="position:absolute;inset:0;pointer-events:none"></canvas>
<script>
(function(){let s=42;const rnd=()=>((s=s*16807%2147483647)/2147483647);
const c=document.getElementById('px').getContext('2d');
for(let i=0;i<24;i++){const x=rnd()*1080,y=520+rnd()*860,r=1+rnd()*1.6;
c.fillStyle=`rgba(247,231,176,${.2+rnd()*.3})`;c.beginPath();c.arc(x,y,r,0,7);c.fill();}})();
</script>

<div class="vignette"></div>
</body>
</html>
