<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- cover-maker · composite template · 1080x1440
     混合模式: API 生成的底图铺底 + HTML 精确文字叠加
     用法: 替换所有 {{占位符}} 后用 Edge 截图 (见 references/rendering.md) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap');

:root{
  --ink:      #f5f2ea;
  --gold-hi:  #f7e7b0;
  --gold-mid: #d4a017;
  --gold-lo:  #8a6414;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1080px;height:1440px;overflow:hidden;position:relative;
  background:#0a0a0f;color:var(--ink);
  font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;
}

/* 底图层 */
.bg{position:absolute;inset:0;width:1080px;height:1440px;object-fit:cover}

/* 顶部压暗, 保证叠字可读 */
.scrim{position:absolute;left:0;right:0;top:0;height:640px;
  background:linear-gradient(180deg,rgba(6,6,10,.80) 0%,rgba(6,6,10,.56) 45%,rgba(6,6,10,0) 100%)}

.stage{position:absolute;inset:0;padding:60px 60px}

.capsule{display:inline-flex;align-items:center;gap:12px;border-radius:999px;
  height:46px;padding:0 26px;font-size:23px;font-weight:700}
.capsule.gold{background:linear-gradient(135deg,var(--gold-hi),var(--gold-mid));color:#141410}
.capsule.line{border:1.5px solid rgba(232,194,90,.42);color:#e8c25a;
  background:rgba(10,10,15,.5);backdrop-filter:blur(6px)}
.capsule .dot{width:9px;height:9px;background:#141410;transform:rotate(45deg)}
.capsule.line .dot{background:#e8c25a}

.gold-text{
  background:linear-gradient(168deg,var(--gold-hi) 8%,var(--gold-mid) 46%,var(--gold-lo) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.num-3d{filter:drop-shadow(0 3px 0 rgba(90,62,8,.9)) drop-shadow(0 7px 0 rgba(0,0,0,.45))
  drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.title{font-weight:900;line-height:1.1;letter-spacing:-.01em;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)) drop-shadow(0 14px 26px rgba(0,0,0,.7))}
.en-note{font-size:21px;font-weight:700;letter-spacing:.24em;color:#e8c25a}

.vignette{position:absolute;inset:0;pointer-events:none;z-index:90;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45) 100%)}
</style>
</head>
<body>

<!-- 底图: 换成 API 生成的背景绝对路径 -->
<img class="bg" src="{{BG_IMAGE}}">

<div class="scrim"></div>

<div class="stage">
  <div style="display:flex;gap:14px">
    <span class="capsule gold"><span class="dot"></span>{{TAG_A}}</span>
    <span class="capsule line"><span class="dot"></span>{{TAG_B}}</span>
  </div>

  <div style="margin-top:38px;display:flex;align-items:flex-start;gap:24px">
    <div class="gold-text num-3d" style="font-weight:900;font-size:230px;line-height:.9">{{NUM}}</div>
    <div style="margin-top:24px">
      <div style="width:40px;height:3px;background:#e8c25a;margin-bottom:12px"></div>
      <div class="en-note">{{EN_NOTE}}</div>
    </div>
  </div>

  <!-- 标题: 两行, 第一行暖白第二行金。字数多就把 font-size 调小 -->
  <div class="title" style="margin-top:16px;font-size:118px">
    <div style="color:var(--ink)">{{TITLE_A}}</div>
    <div class="gold-text">{{TITLE_B}}</div>
  </div>
</div>

<div class="vignette"></div>
</body>
</html>
